<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benergy Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d9ff;
            --dark: #0a1628;
            --surface: #0f1f2e;
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f2e 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(0,217,255,0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,217,255,0.05), transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: auto;
            padding: 0 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0,217,255,0.15);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo svg {
            width: 36px;
            height: 36px;
        }

        .btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--primary);
            color: #0a1628;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: rgba(0,217,255,0.1);
        }

        .hero {
            padding: 40px 0 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 30px;
        }

        .card {
            background: rgba(15,31,46,0.7);
            border: 1px solid rgba(0,217,255,0.15);
            padding: 20px;
            border-radius: 14px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: var(--primary);
            background: rgba(15,31,46,0.9);
        }

        .card h3 {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary);
        }

        .section {
            margin-top: 40px;
        }

        .section h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: var(--text);
        }

        .panel {
            background: rgba(15,31,46,0.7);
            border: 1px solid rgba(0,217,255,0.15);
            padding: 20px;
            border-radius: 14px;
        }

        canvas {
            width: 100%;
            height: 250px;
            max-height: 250px;
        }

        pre {
            color: #cbd5e1;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .status {
            font-size: 14px;
            color: var(--text-muted);
        }

        .status.online {
            color: #22c55e;
        }

        .status.offline {
            color: #f87171;
        }

        .error-box {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid #f87171;
            color: #fca5a5;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0;
        }

        .loading {
            color: var(--primary);
            font-style: italic;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .grid {
                grid-template-columns: 1fr 1fr;
            }

            nav {
                flex-direction: column;
                gap: 16px;
            }

            .btn {
                padding: 10px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="bg-gradient"></div>

<div class="container">

    <!-- NAV -->
    <nav>
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="#0a1628"/>
                <ellipse cx="50" cy="35" rx="18" ry="22" fill="#FFD700"/>
                <circle cx="40" cy="28" r="7" fill="#FFD700"/><circle cx="40" cy="28" r="4" fill="#1a1a1a"/><circle cx="40" cy="28" r="2" fill="#ffffff" opacity="0.8"/>
                <circle cx="60" cy="28" r="7" fill="#FFD700"/><circle cx="60" cy="28" r="4" fill="#1a1a1a"/><circle cx="60" cy="28" r="2" fill="#ffffff" opacity="0.8"/>
                <polygon points="50,40 46,45 54,45" fill="#FFD700"/>
                <path d="M 45 48 Q 50 51 55 48" stroke="#FFD700" stroke-width="2" fill="none" stroke-linecap="round"/>
                <rect x="38" y="56" width="24" height="26" rx="3" fill="#FFD700"/>
                <rect x="25" y="62" width="10" height="16" rx="5" fill="#FFD700"/><circle cx="30" cy="80" r="5" fill="#FFD700"/>
                <rect x="65" y="62" width="10" height="16" rx="5" fill="#FFD700"/><circle cx="70" cy="80" r="5" fill="#FFD700"/>
                <line x1="42" y1="15" x2="38" y2="8" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/><circle cx="38" cy="6" r="2" fill="#FFD700"/>
                <line x1="58" y1="15" x2="62" y2="8" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/><circle cx="62" cy="6" r="2" fill="#FFD700"/>
            </svg>
            BENERGY
        </div>
        <div>
            <a href="https://benergy-io.github.io/" class="btn btn-secondary">← Home</a>
            <button onclick="refreshAll()" class="btn btn-primary">🔄 Refresh</button>
        </div>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <h1>GPU Dashboard</h1>
        <p>Real-time compute monitoring for AI workloads</p>
    </div>

    <!-- METRICS -->
    <div class="grid">
        <div class="card">
            <h3>GPU Usage</h3>
            <div class="value" id="gpu-util">--%</div>
        </div>

        <div class="card">
            <h3>Memory</h3>
            <div class="value" id="gpu-memory">-- MB</div>
        </div>

        <div class="card">
            <h3>Temperature</h3>
            <div class="value" id="gpu-temp">--°C</div>
        </div>

        <div class="card">
            <h3>Status</h3>
            <div class="value status offline" id="status">CHECKING...</div>
        </div>
    </div>

    <!-- CHART -->
    <div class="section">
        <h2>GPU Usage Chart</h2>
        <div class="panel">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <!-- INSIGHTS -->
    <div class="section">
        <h2>Insights</h2>
        <div class="panel">
            <pre id="insights" class="loading">Loading insights...</pre>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="section">
        <h2>History</h2>
        <div class="panel">
            <pre id="history" class="loading">Loading history...</pre>
        </div>
    </div>

</div>

<script>

const BASE_URL = "https://benergy-oi.onrender.com";

let historyData = [];

async function loadMetrics() {
    try {
        const res = await fetch(BASE_URL + "/metrics");
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();

        document.getElementById("gpu-util").innerText =
            data.gpu_utilization + "%";

        document.getElementById("gpu-memory").innerText =
            data.memory_used + " MB";

        document.getElementById("gpu-temp").innerText =
            data.temperature + "°C";

        document.getElementById("status").innerText = "ONLINE";
        document.getElementById("status").className = "value status online";

    } catch (e) {
        console.error("Metrics error:", e);
        document.getElementById("status").innerText = "OFFLINE";
        document.getElementById("status").className = "value status offline";
        document.getElementById("gpu-util").innerText = "--";
        document.getElementById("gpu-memory").innerText = "--";
        document.getElementById("gpu-temp").innerText = "--";
    }
}

async function loadHistory() {
    try {
        const res = await fetch(BASE_URL + "/history");
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();

        // Handle different response formats
        let historyArray = data.data || data || [];
        
        if (historyArray && Array.isArray(historyArray)) {
            historyData = historyArray.slice(-30);
        }
        
        drawChart();

        document.getElementById("history").innerText =
            JSON.stringify(data, null, 2);

    } catch (e) {
        console.error("History error:", e);
        document.getElementById("history").innerText =
            `❌ Failed to load history: ${e.message}`;
    }
}

async function loadInsights() {
    try {
        const res = await fetch(BASE_URL + "/insights");
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();

        document.getElementById("insights").innerText =
            JSON.stringify(data, null, 2);

    } catch (e) {
        console.error("Insights error:", e);
        document.getElementById("insights").innerText =
            `❌ No insights available: ${e.message}`;
    }
}

function drawChart() {
    const canvas = document.getElementById("chart");
    if (!canvas) return;
    
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!historyData || !historyData.length) {
        ctx.fillStyle = var(--text-muted);
        ctx.font = "14px sans-serif";
        ctx.fillText("No data available", 20, canvas.height / 2);
        return;
    }

    const step = canvas.width / historyData.length;

    ctx.beginPath();
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 2;

    historyData.forEach((point, i) => {
        const x = i * step;
        const util = point.gpu_utilization || point[1] || 0;
        const y = canvas.height - (util / 100) * canvas.height;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });

    ctx.stroke();
}

function refreshAll() {
    console.log("Refreshing all data...");
    loadMetrics();
    loadHistory();
    loadInsights();
}

// Initial load
console.log("🚀 Dashboard initializing with API:", BASE_URL);
refreshAll();

// Auto-refresh every 5 seconds
setInterval(refreshAll, 5000);

</script>

</body>
</html>
