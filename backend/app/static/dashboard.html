<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benergy Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d9ff;
            --dark: #0a1628;
            --surface: #0f1f2e;
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f2e 100%);
            color: var(--text);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(0,217,255,0.08), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0,217,255,0.05), transparent 50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: auto;
            padding: 0 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0,217,255,0.15);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
        }

        .btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: #0a1628;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .hero {
            padding: 40px 0 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 30px;
        }

        .card {
            background: rgba(15,31,46,0.7);
            border: 1px solid rgba(0,217,255,0.15);
            padding: 20px;
            border-radius: 14px;
        }

        .card h3 {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .value {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary);
        }

        .section {
            margin-top: 40px;
        }

        .panel {
            background: rgba(15,31,46,0.7);
            border: 1px solid rgba(0,217,255,0.15);
            padding: 20px;
            border-radius: 14px;
        }

        canvas {
            width: 100%;
            height: 250px;
        }

        pre {
            color: #cbd5e1;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .status {
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<div class="bg-gradient"></div>

<div class="container">

    <!-- NAV -->
    <nav>
        <div class="logo">BENERGY</div>
        <div>
            <a href="/" class="btn btn-secondary">← Home</a>
            <button onclick="refreshAll()" class="btn btn-primary">Refresh</button>
        </div>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <h1>GPU Dashboard</h1>
        <p>Real-time compute monitoring for AI workloads</p>
    </div>

    <!-- METRICS -->
    <div class="grid">
        <div class="card">
            <h3>GPU Usage</h3>
            <div class="value" id="gpu-util">--%</div>
        </div>

        <div class="card">
            <h3>Memory</h3>
            <div class="value" id="gpu-memory">-- MB</div>
        </div>

        <div class="card">
            <h3>Temperature</h3>
            <div class="value" id="gpu-temp">--°C</div>
        </div>

        <div class="card">
            <h3>Status</h3>
            <div class="value status" id="status">LIVE</div>
        </div>
    </div>

    <!-- CHART -->
    <div class="section">
        <h2>GPU Usage Chart</h2>
        <div class="panel">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <!-- INSIGHTS -->
    <div class="section">
        <h2>Insights</h2>
        <div class="panel">
            <pre id="insights">Loading...</pre>
        </div>
    </div>

    <!-- HISTORY -->
    <div class="section">
        <h2>History</h2>
        <div class="panel">
            <pre id="history">Loading...</pre>
        </div>
    </div>

</div>

<script>

const BASE_URL =
"https://effective-meme-p7rx79xqqx4rhrgq6-8001.app.github.dev";

let historyData = [];

async function loadMetrics() {
    try {
        const res = await fetch(BASE_URL + "/metrics");
        const data = await res.json();

        document.getElementById("gpu-util").innerText =
            data.gpu_utilization + "%";

        document.getElementById("gpu-memory").innerText =
            data.memory_used + " MB";

        document.getElementById("gpu-temp").innerText =
            data.temperature + "°C";

    } catch (e) {
        document.getElementById("status").innerText = "OFFLINE";
    }
}

async function loadHistory() {
    try {
        const res = await fetch(BASE_URL + "/history");
        const data = await res.json();

        historyData = data.slice(-30);
        drawChart();

        document.getElementById("history").innerText =
            JSON.stringify(data, null, 2);

    } catch (e) {
        console.log("history error");
    }
}

async function loadInsights() {
    try {
        const res = await fetch(BASE_URL + "/insights");
        const data = await res.json();

        document.getElementById("insights").innerText =
            JSON.stringify(data, null, 2);

    } catch (e) {
        document.getElementById("insights").innerText =
            "No insights available";
    }
}

function drawChart() {
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!historyData.length) return;

    const step = canvas.width / historyData.length;

    ctx.beginPath();
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 2;

    historyData.forEach((point, i) => {
        const x = i * step;
        const y = canvas.height - (point.gpu_utilization / 100) * canvas.height;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });

    ctx.stroke();
}

function refreshAll() {
    loadMetrics();
    loadHistory();
    loadInsights();
}

refreshAll();
setInterval(refreshAll, 5000);

</script>

</body>
</html>
