<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benergy - GPU Waste Tracker for AI Teams</title>

    <style>
        /* ===== ORIGINAL UI (UNCHANGED STYLE CORE) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d9ff;
            --dark: #0a1628;
            --surface: #0f1f2e;
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f2e 100%);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 24px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0,217,255,0.2);
        }

        .logo {
            font-weight: 800;
            color: var(--primary);
        }

        .hero {
            text-align: center;
            padding: 120px 0;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 800;
        }

        .highlight {
            color: var(--primary);
        }

        .cta-buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .section {
            padding: 80px 0;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .pricing-card {
            background: rgba(15,31,46,0.6);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(0,217,255,0.2);
            text-align: center;
        }

        .pricing-card.featured {
            border: 2px solid var(--primary);
        }

        .price {
            font-size: 48px;
            color: var(--primary);
            margin: 20px 0;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<div class="container">

    <!-- NAV -->
    <nav>
        <div class="logo">🔥 BENERGY</div>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>Stop <span class="highlight">wasting GPU compute</span></h1>
        <p>Real-time GPU monitoring for AI teams.</p>

        <div class="cta-buttons">
            <button class="btn btn-primary">Start Free Trial</button>
            <button class="btn btn-secondary">Launch Dashboard</button>
        </div>
    </section>

    <!-- PRICING -->
    <section class="section">

        <h2 style="text-align:center;">Pricing</h2>

        <div class="pricing-grid">

            <div class="pricing-card">
                <h3>Solo</h3>
                <div class="price">$19</div>
                <button class="btn btn-secondary" onclick="subscribe('solo')">
                    Get Started
                </button>
            </div>

            <div class="pricing-card featured">
                <h3>Team</h3>
                <div class="price">$99</div>
                <button class="btn btn-primary" onclick="subscribe('team')">
                    Start Team Plan
                </button>
            </div>

            <div class="pricing-card">
                <h3>Enterprise</h3>
                <div class="price">Custom</div>
                <button class="btn btn-secondary">
                    Contact Sales
                </button>
            </div>

        </div>

    </section>

    <footer>
        © 2026 Benergy
    </footer>

</div>

<!-- ===================== -->
<!-- STRIPE FRONTEND FIX -->
<!-- ===================== -->
<script>

const API_BASE = "https://benergy.onrender.com";

// ensure user id exists
if (!localStorage.getItem("user_id")) {
    localStorage.setItem(
        "user_id",
        "a291f1a1-00de-457b-984f-2b2ce26b5675"
    );
}

// smooth scroll (safe)
document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener("click", (e) => {
        e.preventDefault();
        const target = document.querySelector(a.getAttribute("href"));
        if (target) target.scrollIntoView({ behavior: "smooth" });
    });
});

// STRIPE CHECKOUT FIXED
async function subscribe(plan) {

    const user_id = localStorage.getItem("user_id");

    try {
        const res = await fetch(API_BASE + "/create-checkout", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id,
                plan
            })
        });

        const data = await res.json();

        if (data.url) {
            window.location.href = data.url;
        } else {
            alert("Checkout failed: " + JSON.stringify(data));
        }

    } catch (err) {
        console.error(err);
        alert("Network error connecting to backend");
    }
}

</script>

</body>
</html>
