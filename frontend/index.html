<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benergy - GPU Waste Tracker for AI Teams</title>

    <style>
        /* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d9ff;
            --dark: #0a1628;
            --surface: #0f1f2e;
            --text: #ffffff;
            --text-muted: #a0aec0;
            --accent: #00d9ff;
            --accent-dark: #00b8cc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f2e 100%);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 217, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 2;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0, 217, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
        }

        .hero {
            padding: 140px 0 100px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 800;
            margin-bottom: 24px;
        }

        .hero .highlight {
            color: var(--primary);
        }

        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 80px;
        }

        .btn {
            padding: 14px 36px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: black;
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .section {
            padding: 80px 0;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .pricing-card {
            background: rgba(15, 31, 46, 0.6);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(0, 217, 255, 0.15);
        }

        .pricing-card.featured {
            border: 1px solid var(--primary);
        }

        .price {
            font-size: 48px;
            color: var(--primary);
            margin: 20px 0;
        }

        .pricing-features {
            list-style: none;
            text-align: left;
            margin: 20px 0;
        }

        .pricing-features li {
            padding: 8px 0;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

<div class="bg-gradient"></div>

<div class="container">

    <!-- NAV -->
    <nav>
        <div class="logo">🔥 BENERGY</div>
        <ul class="nav-links">
            <li><a href="#features">Features</a></li>
            <li><a href="#pricing">Pricing</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>Stop <span class="highlight">wasting GPU compute</span></h1>
        <p>Real-time GPU monitoring for AI teams.</p>

        <div class="cta-buttons">
            <button class="btn btn-primary">Start Free Trial</button>
            <button class="btn btn-secondary">Launch Dashboard</button>
        </div>
    </section>

    <!-- PRICING -->
    <section class="section" id="pricing">

        <h2 style="text-align:center;">Pricing</h2>

        <div class="pricing-grid">

            <div class="pricing-card">
                <h3>Solo</h3>
                <div class="price">$19</div>
                <ul class="pricing-features">
                    <li>1-3 GPUs</li>
                    <li>Basic dashboard</li>
                </ul>
                <button class="btn btn-secondary">Get Started</button>
            </div>

            <div class="pricing-card featured">
                <h3>Team</h3>
                <div class="price">$99</div>
                <ul class="pricing-features">
                    <li>Up to 20 GPUs</li>
                    <li>Advanced insights</li>
                </ul>
                <button class="btn btn-primary" onclick="subscribe('team')">
                    Start Team Plan
                </button>
            </div>

            <div class="pricing-card">
                <h3>Enterprise</h3>
                <div class="price">Custom</div>
                <ul class="pricing-features">
                    <li>Unlimited GPUs</li>
                    <li>Dedicated support</li>
                </ul>
                <button class="btn btn-secondary">Contact Sales</button>
            </div>

        </div>

    </section>

    <footer>
        © 2026 Benergy
    </footer>

</div>

<script>
const API_BASE = "https://benergy.onrender.com";

// smooth scroll (safe)
document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener("click", (e) => {
        e.preventDefault();
        const target = document.querySelector(a.getAttribute("href"));
        if (target) target.scrollIntoView({ behavior: "smooth" });
    });
});

// handle all buttons safely
document.querySelectorAll(".btn").forEach(btn => {
    btn.addEventListener("click", async () => {
        const text = btn.textContent.toLowerCase();

        try {
            // FREE TRIAL BUTTON
            if (text.includes("free") || text.includes("trial")) {
                const res = await fetch(API_BASE + "/create-user");
                const data = await res.json();

                alert(
                    "Account created!\n\nYour API Key:\n" +
                    data.api_key +
                    "\n\nSave this key."
                );
            }

            // SOLO PLAN (Stripe checkout)
            else if (text.includes("solo")) {
                alert("Solo plan checkout not connected yet to Stripe price ID");
            }

            // TEAM PLAN (Stripe checkout)
            else if (text.includes("team")) {
                const user_id = prompt("Enter your user ID:");

                if (!user_id) return;

                const res = await fetch(
                    `${API_BASE}/create-checkout?user_id=${user_id}&plan=pro`
                );

                const data = await res.json();

                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert("Checkout failed");
                }
            }

            // ENTERPRISE
            else if (text.includes("enterprise")) {
                alert("Contact sales: coming soon");
            }

        } catch (err) {
            console.error(err);
            alert("Something went wrong. Check console.");
        }
    });
});
</script>
</body>
</html>
