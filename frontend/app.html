<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewpo, initial-scale=1.0">
    <title>Dashboard - </title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; }

    :root {
        --primary:#00d9ff;
        --dark:#0a1628;
        --surface:#0f1f2e;
        --text:#fff;
        --muted:#9fb0c0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        background: linear-gradient(135deg,#0a1628,#0f1f2e);
        color: var(--text);
    }

    .bg {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 20% 30%, rgba(0,217,255,0.08), transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(0,217,255,0.06), transparent 50%);
        z-index:0;
    }

    .container {
        position:relative;
        z-index:1;
        max-width:1100px;
        margin:auto;
        padding:24px;
    }

    nav {
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:20px 0;
        border-bottom:1px solid rgba(0,217,255,0.15);
    }

    .logo {
        font-weight:800;
        color:var(--primary);
        font-size:22px;
    }

    .btn {
        padding:10px 14px;
        border-radius:8px;
        border:none;
        cursor:pointer;
        font-weight:600;
    }

    .btn-primary { background:var(--primary); color:#001018; }
    .btn-secondary { background:transparent; border:1px solid var(--primary); color:var(--primary); }

    .header { margin-top:30px; }
    .header h1 { font-size:42px; }
    .header p { color:var(--muted); margin-top:6px; }

    .grid {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:16px;
        margin-top:30px;
    }

    .card {
        background:rgba(15,31,46,0.7);
        border:1px solid rgba(0,217,255,0.15);
        padding:20px;
        border-radius:14px;
    }

    .label { font-size:12px; color:var(--muted); }
    .value { font-size:34px; color:var(--primary); font-weight:800; margin-top:6px; }

    .section { margin-top:40px; }

    .section h2 { font-size:20px; margin-bottom:12px; }

    .panel {
        background:rgba(15,31,46,0.6);
        border:1px solid rgba(0,217,255,0.15);
        padding:16px;
        border-radius:14px;
    }

    .insight {
        padding:10px;
        border-bottom:1px solid rgba(255,255,255,0.05);
        color:var(--muted);
        font-size:14px;
    }

    canvas { width:100%; height:260px; }
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<nav>
    <div class="logo">BENERGY</div>
    <div>
        <a class="btn btn-secondary" href="/">Home</a>
        <button class="btn btn-primary" onclick="refresh()">Refresh</button>
    </div>
</nav>

<div class="header">
    <h1>GPU Dashboard</h1>
    <p>Real-time compute visibility</p>
</div>

<!-- METRICS -->
<div class="grid">
    <div class="card">
        <div class="label">GPU Usage</div>
        <div class="value" id="gpu">--%</div>
    </div>

    <div class="card">
        <div class="label">Memory</div>
        <div class="value" id="mem">-- MB</div>
    </div>

    <div class="card">
        <div class="label">Temperature</div>
        <div class="value" id="temp">--°C</div>
    </div>

    <div class="card">
        <div class="label">Status</div>
        <div class="value" id="status">LIVE</div>
    </div>
</div>

<!-- CHART -->
<div class="section">
    <h2>GPU Trend</h2>
    <div class="panel">
        <canvas id="chart"></canvas>
    </div>
</div>

<!-- INSIGHTS -->
<div class="section">
    <h2>Insights</h2>
    <div class="panel" id="insightsBox">
        Loading...
    </div>
</div>

</div>

<script>

const CONFIG = {
    BASE_URL: "https://effective-meme-p7rx79xqqx4rhrgq6-8001.app.github.dev"
};

let history = [];

async function loadMetrics() {
    try {
        const r = await fetch(CONFIG.BASE_URL + "/metrics");
        const d = await r.json();

        document.getElementById("gpu").innerText = d.gpu_utilization + "%";
        document.getElementById("mem").innerText = d.memory_used + " MB";
        document.getElementById("temp").innerText = d.temperature + "°C";
    } catch (e) {
        document.getElementById("status").innerText = "OFFLINE";
    }
}

async function loadHistory() {
    try {
        const r = await fetch(CONFIG.BASE_URL + "/history");
        const d = await r.json();
        history = d.slice(-30);
        draw();
    } catch (e) {}
}

async function loadInsights() {
    try {
        const r = await fetch(CONFIG.BASE_URL + "/insights");
        const d = await r.json();

        document.getElementById("insightsBox").innerHTML = `
            <div class="insight">✔ ${d.status || "OK"}</div>
            <div class="insight">💡 ${d.recommendation || "Optimize GPU usage"}</div>
            <div class="insight">⚠ ${d.alert || "None"}</div>
        `;
    } catch (e) {
        document.getElementById("insightsBox").innerHTML =
            "<div class='insight'>No insights</div>";
    }
}

function draw() {
    const c = document.getElementById("chart");
    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,c.width,c.height);

    if(!history.length) return;

    const step = c.width / history.length;

    ctx.beginPath();
    ctx.strokeStyle = "#00d9ff";
    ctx.lineWidth = 2;

    history.forEach((p,i)=>{
        const x = i * step;
        const y = c.height - (p.gpu_utilization/100)*c.height;

        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });

    ctx.stroke();
}

function refresh() {
    loadMetrics();
    loadHistory();
    loadInsights();
}

refresh();
setInterval(refresh, 5000);

</script>

</body>
</html>
