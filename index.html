<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benergy GPU Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1220;
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        .container {
            padding: 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: #38bdf8;
            font-size: 42px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .status {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .api-key-section {
            background: #111827;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .api-key-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .api-key-section input {
            width: 100%;
            padding: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
        }

        .api-key-section input::placeholder {
            color: #64748b;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            background: #38bdf8;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            color: #0b1220;
        }

        button:hover {
            background: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .card {
            background: #111827;
            margin: 20px auto;
            padding: 20px;
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            text-align: left;
            border: 1px solid #1e293b;
            min-height: 100px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #cbd5e1;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .error {
            color: #f87171;
            background: rgba(244, 63, 94, 0.1);
            border-left: 3px solid #f87171;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .success {
            color: #86efac;
            background: rgba(34, 197, 94, 0.1);
            border-left: 3px solid #86efac;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .loading {
            color: #38bdf8;
            font-style: italic;
        }

        .endpoint-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 40px;
        }

        .endpoint-group {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        .endpoint-group h3 {
            color: #38bdf8;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .endpoint-group button {
            width: 100%;
            padding: 10px 12px;
            font-size: 12px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 40px 15px;
            }

            h1 {
                font-size: 32px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            pre {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 50px; height: 50px; display: inline-block;">
            <circle cx="50" cy="50" r="48" fill="#0b1220"/>
            <ellipse cx="50" cy="35" rx="18" ry="22" fill="#FFD700"/>
            <circle cx="40" cy="28" r="7" fill="#FFD700"/><circle cx="40" cy="28" r="4" fill="#1a1a1a"/><circle cx="40" cy="28" r="2" fill="#ffffff" opacity="0.8"/>
            <circle cx="60" cy="28" r="7" fill="#FFD700"/><circle cx="60" cy="28" r="4" fill="#1a1a1a"/><circle cx="60" cy="28" r="2" fill="#ffffff" opacity="0.8"/>
            <polygon points="50,40 46,45 54,45" fill="#FFD700"/>
            <path d="M 45 48 Q 50 51 55 48" stroke="#FFD700" stroke-width="2" fill="none" stroke-linecap="round"/>
            <rect x="38" y="56" width="24" height="26" rx="3" fill="#FFD700"/>
            <rect x="25" y="62" width="10" height="16" rx="5" fill="#FFD700"/><circle cx="30" cy="80" r="5" fill="#FFD700"/>
            <rect x="65" y="62" width="10" height="16" rx="5" fill="#FFD700"/><circle cx="70" cy="80" r="5" fill="#FFD700"/>
            <line x1="42" y1="15" x2="38" y2="8" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/><circle cx="38" cy="6" r="2" fill="#FFD700"/>
            <line x1="58" y1="15" x2="62" y2="8" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/><circle cx="62" cy="6" r="2" fill="#FFD700"/>
        </svg>
        Benergy
    </h1>
    <p class="subtitle">Real-time GPU monitoring & optimization</p>

    <div class="status" id="apiStatus">
        🔴 API Status: Checking...
    </div>

    <!-- API Key Section -->
    <div class="api-key-section">
        <label for="apiKey">API Key (optional for public endpoints)</label>
        <input 
            type="password" 
            id="apiKey" 
            placeholder="Paste your API key here for authenticated endpoints"
        >
    </div>

    <!-- Public Endpoints -->
    <div>
        <h3 style="color: #94a3b8; margin: 30px 0 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">
            Public Endpoints
        </h3>
        <div class="buttons">
            <button onclick="checkHealth()">🏥 Health Check</button>
            <button onclick="createUser()">👤 Create User</button>
            <button onclick="getMetrics()">📊 Metrics</button>
            <button onclick="getDashboard()">📈 Dashboard</button>
        </div>
    </div>

    <!-- Authenticated Endpoints -->
    <div>
        <h3 style="color: #94a3b8; margin: 30px 0 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">
            Authenticated Endpoints (needs API key)
        </h3>
        <div class="buttons">
            <button onclick="getHistory()">📜 History</button>
            <button onclick="getInsights()">💡 Insights</button>
            <button onclick="getAlerts()">⚠️ Alerts</button>
        </div>
    </div>

    <!-- Waitlist & Contact -->
    <div>
        <h3 style="color: #94a3b8; margin: 30px 0 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">
            Engagement
        </h3>
        <div class="buttons">
            <button onclick="joinWaitlist()">📧 Join Waitlist</button>
            <button onclick="contactForm()">💬 Contact Us</button>
        </div>
    </div>

    <!-- Output -->
    <div class="card" id="output">
        <pre>Click a button to load data...</pre>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const BASE_URL = "https://benergy-oi.onrender.com";

        // Check API status on load
        checkApiStatus();

        // Auto-check API status every 30 seconds
        setInterval(checkApiStatus, 30000);

        async function checkApiStatus() {
            try {
                const res = await fetch(BASE_URL + "/health", { method: "GET" });
                if (res.ok) {
                    document.getElementById("apiStatus").innerHTML = "🟢 API Status: Online";
                    document.getElementById("apiStatus").style.borderColor = "#22c55e";
                    document.getElementById("apiStatus").style.background = "rgba(34, 197, 94, 0.1)";
                    document.getElementById("apiStatus").style.color = "#22c55e";
                } else {
                    document.getElementById("apiStatus").innerHTML = "🔴 API Status: Error";
                }
            } catch (err) {
                document.getElementById("apiStatus").innerHTML = "🔴 API Status: Offline";
            }
        }

        async function makeRequest(endpoint, method = "GET", body = null, needsAuth = false) {
            const BASE_URL = "https://benergy-oi.onrender.com";
            
            try {
                document.getElementById("output").innerHTML = "<pre class='loading'>Loading...</pre>";

                const headers = { "Content-Type": "application/json" };

                if (needsAuth) {
                    const apiKey = document.getElementById("apiKey")?.value;
                    if (!apiKey) {
                        showError("API key required for this endpoint. Please paste your key above.");
                        return;
                    }
                    headers["x-api-key"] = apiKey;
                }

                const options = { method, headers };
                if (body) options.body = JSON.stringify(body);

                const res = await fetch(BASE_URL + endpoint, options);
                const data = await res.json();

                if (!res.ok) {
                    showError(`Error: ${data.error || data.message || "Request failed"}`);
                    return;
                }

                document.getElementById("output").innerHTML =
                    "<pre>" + JSON.stringify(data, null, 2) + "</pre>";

            } catch (err) {
                showError(`Network Error: ${err.message}`);
            }
        }

        function showError(message) {
            document.getElementById("output").innerHTML =
                `<div class="error">❌ ${message}</div>`;
        }

        function showSuccess(message) {
            document.getElementById("output").innerHTML =
                `<div class="success">✅ ${message}</div>`;
        }

        // Public endpoints
        window.checkHealth = () => makeRequest("/health");
        window.createUser = () => makeRequest("/create-user");
        window.getMetrics = () => makeRequest("/metrics");
        window.getDashboard = () => makeRequest("/dashboard");

        // Authenticated endpoints
        window.getHistory = () => makeRequest("/history", "GET", null, true);
        window.getInsights = () => makeRequest("/insights", "GET", null, true);
        window.getAlerts = () => makeRequest("/alerts", "GET", null, true);

        // Form endpoints
        window.joinWaitlist = async () => {
            const email = prompt("Enter your email:");
            if (email) {
                makeRequest("/waitlist", "POST", { email });
            }
        };

        window.contactForm = async () => {
            const name = prompt("Your name:");
            if (!name) return;
            
            const email = prompt("Your email:");
            if (!email) return;
            
            const company = prompt("Your company (optional):");
            
            makeRequest("/contact", "POST", { name, email, company });
        };
    });
</script>

</body>
</html>
