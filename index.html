<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benergy - GPU Waste Tracker for AI Teams</title>
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        /* ================= YOUR ORIGINAL CSS (UNCHANGED) ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #00d9ff;
            --dark: #0a1628;
            --surface: #0f1f2e;
            --text: #ffffff;
            --text-muted: #a0aec0;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f2e 100%);
            color: var(--text);
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0,217,255,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
        }

        .hero { padding: 100px 0 80px; text-align: center; }

        .highlight { color: var(--primary); }

        .btn {
            padding: 14px 36px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary { background: var(--primary); color: var(--dark); }
        .btn-secondary { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 80px;
        }

        .stat-number { font-size: 32px; font-weight: 800; color: var(--primary); }

        .section { padding: 80px 0; }

        .problem-grid, .features-grid, .testimonials-grid, .team-grid {
            display: grid;
            gap: 24px;
        }

        .waitlist-section {
            background: rgba(0,217,255,0.08);
            padding: 48px;
            text-align: center;
        }

        .faq-answer { max-height: 0; overflow: hidden; transition: 0.3s; }
        .faq-answer.open { max-height: 300px; padding: 10px 0; }

    </style>
</head>

<body>

<div class="container">

    <!-- NAV -->
    <nav>
        <div class="logo">🚀 BENERGY</div>
        <ul class="nav-links">
            <li><a onclick="scrollToFeatures()">Features</a></li>
            <li><a onclick="scrollToPricing()">Pricing</a></li>
            <li><a onclick="goToDashboard()">Dashboard</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <section class="hero">
        <h1>Stop <span class="highlight">wasting GPU compute</span></h1>
        <p>Real-time GPU monitoring for AI teams.</p>

        <button class="btn btn-primary" onclick="joinWaitlist()">Join Waitlist</button>
        <button class="btn btn-secondary" onclick="startTrial()">Try Free</button>
    </section>

    <!-- STATS -->
    <div class="stats-section">
        <div>
            <div class="stat-number">30-40%</div>
            <div>GPU waste</div>
        </div>
        <div>
            <div class="stat-number">$1.2k</div>
            <div>Monthly savings</div>
        </div>
        <div>
            <div class="stat-number">5 min</div>
            <div>Setup</div>
        </div>
    </div>

    <!-- FEATURES -->
    <section class="section" id="features">
        <h2>Features</h2>
    </section>

    <!-- PRICING -->
    <section class="section" id="pricing">
        <h2>Pricing</h2>
    </section>

    <!-- WAITLIST -->
    <section class="waitlist-section">
        <input type="email" id="waitlistEmail" placeholder="Email">
        <button class="btn btn-primary" onclick="addToWaitlist()">Join</button>
    </section>

</div>

<script>
const API_BASE = "https://benergy.onrender.com";
const DASHBOARD_URL = API_BASE + "/dashboard";

// ================= API KEY SYSTEM =================
function getApiKey() {
    return localStorage.getItem("benergy_api_key");
}

function setApiKey(key) {
    localStorage.setItem("benergy_api_key", key);
}

// create user if missing
async function ensureUser() {
    if (!getApiKey()) {
        try {
            const res = await fetch(`${API_BASE}/create-user`);
            const data = await res.json();

            if (data.api_key) {
                setApiKey(data.api_key);
                console.log("✅ API key created:", data.api_key);
            }
        } catch (e) {
            console.error("User creation failed", e);
        }
    }
}

// ================= API CALL =================
async function apiCall(endpoint) {
    const key = getApiKey();

    const res = await fetch(API_BASE + endpoint, {
        headers: {
            "x-api-key": key || ""
        }
    });

    return res.json();
}

// ================= NAV =================
function scrollToFeatures() {
    document.getElementById("features")?.scrollIntoView({ behavior: "smooth" });
}

function scrollToPricing() {
    document.getElementById("pricing")?.scrollIntoView({ behavior: "smooth" });
}

function goToDashboard() {
    window.location.href = DASHBOARD_URL;
}

// ================= WAITLIST =================
function joinWaitlist() {
    const email = prompt("Enter email:");
    if (email) addToWaitlist(email);
}

function addToWaitlist(email) {
    email = email || document.getElementById("waitlistEmail").value;

    if (!email) return alert("Enter email");

    alert("✅ Added: " + email);
}

// ================= TRIAL =================
function startTrial() {
    alert("🚀 Trial started (frontend demo)");
}

// ================= FAQ =================
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".faq-question").forEach(el => {
        el.addEventListener("click", () => {
            const ans = el.nextElementSibling;
            ans.classList.toggle("open");
        });
    });
});

// ================= INIT =================
window.addEventListener("load", async () => {
    await ensureUser();

    // test backend connection
    try {
        const data = await apiCall("/dashboard-data");
        console.log("📊 Dashboard ready:", data);
    } catch (e) {
        console.error("Dashboard error:", e);
    }
});
</script>

</body>
</html>
