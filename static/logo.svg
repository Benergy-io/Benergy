<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#0a1628" stroke="#FFD700" stroke-width="8"/><!-- Head --><ellipse cx="200" cy="140" rx="90" ry="110" fill="#1a1a1a" stroke="#FFD700" stroke-width="8"/><!-- Left Eye (large) --><circle cx="150" cy="110" r="35" fill="#FFD700"/>
  <circle cx="150" cy="110" r="20" fill="#1a1a1a"/>
  <circle cx="152" cy="105" r="8" fill="#FFD700"/><!-- Right Eye (large) --><circle cx="250" cy="110" r="35" fill="#FFD700"/>
  <circle cx="250" cy="110" r="20" fill="#1a1a1a"/>
  <circle cx="252" cy="105" r="8" fill="#FFD700"/><!-- Nose --><polygon points="200,150 190,170 210,170" fill="#FFD700"/><!-- Mouth --><path d="M 170 190 Q 200 210 230 190" stroke="#FFD700" stroke-width="6" fill="none" stroke-linecap="round"/><!-- Body --><rect x="130" y="240" width="140" height="120" rx="15" fill="#2a2a2a" stroke="#FFD700" stroke-width="6"/><!-- Left Arm --><rect x="60" y="260" width="60" height="100" rx="20" fill="#1a1a1a" stroke="#FFD700" stroke-width="5"/>
  <circle cx="90" cy="360" r="18" fill="#FFD700"/><!-- Right Arm --><rect x="280" y="260" width="60" height="100" rx="20" fill="#1a1a1a" stroke="#FFD700" stroke-width="5"/>
  <circle cx="310" cy="360" r="18" fill="#FFD700"/><!-- Neck connector --><rect x="175" y="225" width="50" height="20" fill="#1a1a1a"/><!-- Left antenna --><line x1="140" y1="30" x2="130" y2="0" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
  <circle cx="130" cy="0" r="12" fill="#FFD700"/><!-- Right antenna --><line x1="260" y1="30" x2="270" y2="0" stroke="#FFD700" stroke-width="8" stroke-linecap="round"/>
  <circle cx="270" cy="0" r="12" fill="#FFD700"/><!-- Glow effect --><defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

<!-- Apply glow to eyes --><circle cx="150" cy="110" r="40" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
  <circle cx="250" cy="110" r="40" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5" filter="url(#glow)"/>
</svg>
